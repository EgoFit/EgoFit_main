{% extends 'account/_shell.html' %}
{% load i18n %}

{% block title %}{% blocktrans %}تایید شماره جدید | ایگوفیت{% endblocktrans %}{% endblock %}

{% block account_content %}
<section class="profile-screen">
    <header class="profile-screen__header">
        <h2 class="profile-screen__title">{{ account_title }}</h2>
    </header>
    <p class="profile-screen__lead">{{ account_description }}</p>

    <section class="profile-panel-card">
        <form method="post" class="stack-form">
            {% csrf_token %}
            <div class="field-group">
                <label>{% trans 'کد تایید' %}</label>
                {{ form.code }}
                {{ form.code.errors }}
            </div>
            <div class="form-actions">
                <button type="submit" class="cta-primary cta-primary--strong">{% trans 'تایید و ثبت شماره' %}</button>
            </div>
        </form>
    </section>
</section>
{% endblock %}
